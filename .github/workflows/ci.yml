name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      # Locale parity is already a compile error (`locales/index.ts` types every
      # locale against `bg`), so this covers what the compiler structurally
      # cannot: empty strings and ICU placeholder drift between locales.
      - name: i18n integrity
        run: pnpm i18n:check
